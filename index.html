<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Вольт — электроника с доставкой завтра</title>
<meta name="description" content="Смартфоны, ноутбуки, наушники и часы. Доставка завтра, бесплатно от 30 000 ₽.">
</head>
<body>
<main class="wrap">
  <section class="promo">
    <div><h1>Минус 10% на первый заказ</h1><p>Введите промокод в корзине. Действует на всё, кроме уцененных товаров.</p></div>
    <span class="code">START10</span>
  </section>
  <div class="chips" id="chips" role="group" aria-label="Категории"></div>
  <div class="bar">
    <span id="count"></span>
    <label style="display:flex;align-items:center;gap:.5rem;color:var(--ink)"><input type="checkbox" id="saleOnly" style="width:auto"> Только со скидкой</label>
    <select id="sort" aria-label="Сортировка">
      <option value="popular">По популярности</option><option value="cheap">Сначала дешевле</option>
      <option value="expensive">Сначала дороже</option><option value="rating">По рейтингу</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
